<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diwali</title>
<meta name="theme-color" content="#000000">
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
  :root { --gold:#ffc65a; --amber:#ff8a1f; --clay:#b5532a; box-sizing:border-box; }
  *,*::before,*::after { box-sizing:inherit; }
  html,body { margin:0; height:100%; background:#000; overflow:hidden; font-family:Georgia,serif; overscroll-behavior:none; -webkit-tap-highlight-color:transparent; }
  body { touch-action:none; -webkit-user-select:none; user-select:none; }

  /* ---------- Scene 1: the dark room ---------- */
  #scene1 { position:fixed; inset:0; background:#050302; cursor:none; z-index:2;
            transition:transform 1.1s cubic-bezier(.7,0,.2,1); }
  #scene1.up { transform:translateY(-100%); }
  #floor { position:absolute; inset:0;
           background:radial-gradient(ellipse at 50% 110%, #2a160b 0, #0d0705 55%, #050302 100%); }

  .diya { position:absolute; width:120px; height:70px; transform-origin:0 0; }
  .diya svg { width:100%; height:100%; overflow:visible; }
  .diyaGlow { position:absolute; left:64px; top:12px; width:0; height:0; border-radius:50%;
              background:radial-gradient(circle, rgba(255,170,60,.55), rgba(255,120,20,0) 70%);
              transform:translate(-50%,-50%); transition:width 1.4s, height 1.4s; }
  .diya.lit .diyaGlow { width:420px; height:420px; }
  .flame { position:absolute; width:16px; height:34px; left:64px; top:12px;
           transform:translate(-50%,-100%) scale(0); transform-origin:50% 100%;
           transition:transform .5s; pointer-events:none; }
  .flame i { position:absolute; inset:0; border-radius:50% 50% 50% 50% / 65% 65% 35% 35%;
             background:radial-gradient(ellipse at 50% 75%, #fff6c9 0, #ffd24d 35%, #ff7a12 75%, rgba(255,60,0,0) 100%);
             animation:sway .18s infinite alternate ease-in-out; filter:blur(.4px); }
  .diya.lit .flame { transform:translate(-50%,-100%) scale(1.5); }
  @keyframes sway { from { transform:skewX(-5deg) scaleY(.94);} to { transform:skewX(5deg) scaleY(1.06);} }

  /* darkness with the torch hole, painted from JS */
  #dark { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  /* match that follows the pointer; the flame sits exactly on the pointer */
  #match { position:absolute; left:0; top:0; z-index:5; pointer-events:none; opacity:0; transition:opacity .4s; }
  #match.on { opacity:1; }
  #match .stick { position:absolute; left:-3px; top:8px; width:6px; height:150px; border-radius:3px;
                  background:linear-gradient(90deg,#c99a5b,#8a5a2b); transform-origin:50% 0; transform:rotate(18deg); }
  #match .head { position:absolute; left:-5px; top:2px; width:10px; height:12px; border-radius:50% 50% 45% 45%;
                 background:#3a0f08; transform:rotate(18deg); transform-origin:50% 100%; }
  #match .flame { left:0; top:6px; transform:translate(-50%,-100%) scale(var(--s,1)); transition:none; }

  #hint { position:absolute; left:0; right:0; bottom:max(28px, env(safe-area-inset-bottom, 0px));
          text-align:center; color:#ffd98a; font-family:'Yatra One',Georgia,serif; font-size:clamp(15px,1.6vw + 9px,20px); letter-spacing:.05em; opacity:.55; text-shadow:0 0 12px rgba(255,140,40,.4);
          pointer-events:none; z-index:6; padding:0 24px; transition:opacity .6s; }

  /* ---------- Scene 2: dark again, greeting emerges ---------- */
  #scene2 { position:fixed; inset:0; background:#000; z-index:1; display:flex; flex-direction:column;
            align-items:center; justify-content:center; text-align:center; padding:24px; }
  #title { font-family:'Yatra One',Georgia,serif; font-weight:400; font-size:clamp(34px,min(10.5vw,17vh),128px); line-height:1.1;
           margin:0; white-space:nowrap; letter-spacing:.02em; }
  #title span { display:inline-block; opacity:0; padding:0 .02em; transform:translateY(10px); color:transparent; -webkit-text-fill-color:transparent; -webkit-background-clip:text; background-clip:text; filter:blur(14px) drop-shadow(0 0 0 rgba(255,140,40,0)) drop-shadow(0 0 0 rgba(255,90,30,0)); }
  #title .sp { width:.28em; }
  #scene2.go #title span { animation:emerge 1.1s forwards cubic-bezier(.2,.7,.2,1); }
  @keyframes emerge { to { opacity:1; filter:blur(0) drop-shadow(0 0 16px rgba(255,140,40,.65)) drop-shadow(0 0 40px rgba(255,90,30,.35)); transform:none;
                           } }
  #sub { font-family:'Tiro Devanagari Hindi',Georgia,serif; font-size:clamp(22px,min(5.5vw,9vh),56px); text-shadow:0 0 22px rgba(255,150,40,.6);
         color:#ffd36b; margin:18px 0 0; opacity:0; transition:opacity 2s 1.5s; }
  #scene2.go #sub { opacity:.9; }
  #again { margin-top:44px; background:none; border:1px solid rgba(255,198,90,.45); color:#ffd36b;
           padding:12px 26px; min-height:44px; border-radius:999px; font-family:'Yatra One',Georgia,serif; font-size:18px; cursor:pointer;
           opacity:0; transition:opacity 1.5s 2.6s, background .2s; }
  #scene2.go #again { opacity:1; }
  #again:hover { background:rgba(255,198,90,.12); }
  #again:focus-visible { outline:2px solid var(--gold); outline-offset:3px; }
  .spark { position:absolute; bottom:-10px; width:3px; height:3px; border-radius:50%; background:#ffb347;
           box-shadow:0 0 8px 2px rgba(255,160,50,.7); opacity:0; }
  #scene2.go .spark { animation:rise linear infinite; }
  @keyframes rise { 0%{ transform:translateY(0); opacity:0;} 15%{opacity:.9;} 100%{ transform:translateY(-105vh) translateX(30px); opacity:0;} }

  @media (prefers-reduced-motion: reduce) {
    #scene1 { transition-duration:.01s; } #scene2.go .spark { animation:none; }
  }
  #fx { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; }
  #title,#sub,#again { position:relative; z-index:1; }
  #mute { position:fixed; z-index:20; right:max(16px, env(safe-area-inset-right, 0px)); top:max(14px, env(safe-area-inset-top, 0px)); width:44px; height:44px;
          border-radius:50%; border:1px solid rgba(255,198,90,.4); background:rgba(0,0,0,.45); color:#ffc65a;
          font-size:18px; cursor:pointer; }
  #mute:focus-visible { outline:2px solid #ffc65a; outline-offset:3px; }
  #counter { position:absolute; z-index:6; left:max(18px, env(safe-area-inset-left, 0px)); top:max(12px, env(safe-area-inset-top, 0px)); display:flex; align-items:center; gap:8px;
             font-family:'Yatra One',Georgia,serif; font-size:clamp(22px,3vw + 10px,32px); color:#ffd36b; text-shadow:0 0 16px rgba(255,140,40,.7);
             opacity:0; transition:opacity .6s, transform .3s; transform-origin:left center; pointer-events:none; }
  #counter.on { opacity:1; } #counter.bump { transform:scale(1.25); } #counter .ico { font-size:26px; }
</style>
</head>
<body>

<div id="scene1">
  <div id="floor"></div>
  <div class="diya">
    <div class="diyaGlow"></div>
    <svg viewBox="0 0 120 70" aria-label="Diya">
      <path d="M6 28 C12 62 40 68 60 68 C80 68 108 62 114 28 C90 38 30 38 6 28Z" fill="#a8461f"/>
      <path d="M14 40 C30 56 90 56 106 40" fill="none" stroke="#d98a4a" stroke-width="2" opacity=".6"/>
      <ellipse cx="60" cy="28" rx="54" ry="9" fill="#d9773a"/>
      <ellipse cx="60" cy="28" rx="45" ry="6" fill="#4a2410"/>
      <path d="M60 28 Q62 18 64 12" stroke="#1d120c" stroke-width="4" stroke-linecap="round" fill="none"/>
    </svg>
    <div class="flame"><i></i></div>
  </div>
  <canvas id="dark"></canvas>
  <div id="match"><div class="stick"></div><div class="head"></div><div class="flame"><i></i></div></div>
  <div id="hint">Double click to light up the matchstick</div>
  <div id="counter"><span class="ico">🪔</span><span id="count">0/5</span></div>
</div>

<div id="scene2">
  <canvas id="fx"></canvas>
  <h1 id="title" aria-label="Happy Diwali"></h1>
  <p id="sub">शुभ दीपावली</p>
  <button id="again" type="button">Light it again</button>
</div>

<button id="mute" type="button" aria-label="Sound on">🔊</button>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const scene1 = $('scene1'), scene2 = $('scene2'), dark = $('dark'), match = $('match'), hint = $('hint'), counter = $('counter'), count = $('count');
  const dc = dark.getContext('2d'), fx = $('fx'), fc = fx.getContext('2d');
  const W = () => innerWidth, H = () => innerHeight;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const coarse = matchMedia('(pointer:coarse)').matches;
  const verb = coarse ? 'Double tap' : 'Double click';
  const K = () => clamp(Math.min(W(), H()) / 720, .7, 1.25);   // overall scale for small / large screens
  hint.textContent = verb + ' to light up the matchstick';
  function sizeCanvases() { const dpr = Math.min(devicePixelRatio || 1, 2); dark.width = W(); dark.height = H(); fx.width = W() * dpr; fx.height = H() * dpr; fc.setTransform(dpr, 0, 0, dpr, 0, 0); }
  sizeCanvases(); addEventListener('resize', sizeCanvases);

  /* ---------------- Sound (all synthesised, no files) ---------------- */
  let ac = null, master = null, nb = null, muted = false;
  function initAudio() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = .7; master.connect(ac.destination);
      nb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
      const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; }
  }
  function noise(dur, o = {}) {
    if (!ac || muted) return;
    const { type = 'bandpass', freq = 1000, to = null, q = 1, gain = .3, attack = .005, delay = 0 } = o;
    const t = ac.currentTime + delay;
    const s = ac.createBufferSource(); s.buffer = nb;
    const f = ac.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(freq, t);
    if (to) f.frequency.exponentialRampToValueAtTime(to, t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + attack); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random() * .8); s.stop(t + dur + .05);
  }
  function tone(freq, dur, o = {}) {
    if (!ac || muted) return;
    const { type = 'sine', gain = .15, attack = .01, to = null, delay = 0 } = o;
    const t = ac.currentTime + delay;
    const os = ac.createOscillator(); os.type = type; os.frequency.setValueAtTime(freq, t);
    if (to) os.frequency.exponentialRampToValueAtTime(to, t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + attack); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    os.connect(g); g.connect(master); os.start(t); os.stop(t + dur + .05);
  }
  const sfx = {
    strike() { noise(.3, { freq: 3500, to: 900, q: .7, gain: .35 }); noise(.7, { type: 'lowpass', freq: 500, gain: .35, attack: .12, delay: .15 }); },
    tick() { noise(.03, { type: 'highpass', freq: 2500, gain: .1 }); },
    light(i) { noise(.6, { type: 'lowpass', freq: 400, gain: .4, attack: .05 });
               [0, 1].forEach(k => tone([659, 784, 988, 1319, 1568][i % 5] * (k ? 1.5 : 1), 1.6, { gain: k ? .05 : .11, attack: .02, delay: .05 + k * .1 })); },
    whoosh() { noise(1.1, { type: 'lowpass', freq: 250, to: 1400, gain: .3, attack: .5 }); },
    letter(i) { tone([784, 988, 1175, 1568][i % 4], 1.2, { gain: .035, delay: i * .12 }); },
    launch() { tone(350, .6, { to: 1600, gain: .035 }); },
    boom() { noise(.9, { type: 'lowpass', freq: 1000, to: 70, gain: .7, attack: .003 });
             for (let k = 0; k < 7; k++) noise(.05, { type: 'highpass', freq: 3000, gain: .15, delay: .12 + Math.random() * .7 }); }
  };
  const muteBtn = $('mute');
  muteBtn.addEventListener('pointerdown', e => e.stopPropagation());
  muteBtn.onclick = () => { muted = !muted; muteBtn.textContent = muted ? '🔇' : '🔊'; muteBtn.setAttribute('aria-label', muted ? 'Sound off' : 'Sound on'); };

  /* ---------------- Title + sparks ---------------- */
  const title = $('title');
  [...'Happy Diwali'].forEach((ch, i) => {
    const s = document.createElement('span');
    s.textContent = ch === ' ' ? '\u00A0' : ch;
    if (ch === ' ') s.className = 'sp';
    s.style.animationDelay = (i * 0.12) + 's';
    s.style.backgroundImage = `linear-gradient(180deg,${['#fff7b0','#ffe08a','#ffd0e0','#fff2a0','#ffc98a'][i % 5]},${['#ffc400','#ff8a00','#ff4d8d','#ffb300','#ff5a1f'][i % 5]})`;
    title.appendChild(s);
  });
  for (let i = 0; i < 26; i++) {
    const p = document.createElement('div'); p.className = 'spark';
    p.style.left = (Math.random() * 100) + '%';
    p.style.animationDuration = (7 + Math.random() * 8) + 's';
    p.style.animationDelay = (Math.random() * 8) + 's';
    scene2.appendChild(p);
  }
  $('again').onclick = () => location.reload();

  /* ---------------- Four diyas, one hidden in each quarter ---------------- */
  const tpl = document.querySelector('.diya');
  const els = [tpl];
  for (let i = 0; i < 4; i++) { const c = tpl.cloneNode(true); tpl.parentNode.insertBefore(c, dark); els.push(c); }
  const diyas = els.map((el, i) => {
    const qx = i % 2, qy = i >> 1;
    const mid = i === 4,   // the fifth diya hides near the centre
          nx = mid ? .42 + Math.random() * .16 : (qx + .15 + Math.random() * .55) / 2,
          ny = mid ? .42 + Math.random() * .16 : (qy + .15 + Math.random() * .55) / 2;
    
    
    return { el, nx, ny, lit: false, r: 0, wx: () => el.offsetLeft + 64 * K(), wy: () => el.offsetTop + 12 * K() };
  });
  let litCount = 0;
  function placeAll() {
    const k = K(), w = W(), h = H();
    diyas.forEach(d => {
      d.el.style.transform = `scale(${k})`;
      d.el.style.left = clamp(d.nx * w - 60 * k, 12, w - 132 * k) + 'px';
      d.el.style.top = clamp(d.ny * h - 35 * k, 56, h - 120 * k) + 'px';
    });
  }
  placeAll(); addEventListener('resize', placeAll);

  /* ---------------- Game state ---------------- */
  let state = 'seek';            // seek -> match -> done
  let px = -999, py = -999, pr = 0, burnEnd = 0, last = { t: 0, x: 0, y: 0 };
  function setHint(t) { hint.style.opacity = 0; setTimeout(() => { hint.textContent = t; hint.style.opacity = .55; }, 350); }

  addEventListener('pointermove', e => { px = e.clientX; py = e.clientY; });
  addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('pointerdown', e => {
    initAudio();
    px = e.clientX; py = e.clientY;
    const now = performance.now();
    const dbl = now - last.t < 380 && Math.hypot(px - last.x, py - last.y) < 40;
    last = { t: now, x: px, y: py };
    if (dbl && state === 'seek') strike();
  });

  function strike() {
    state = 'match'; burnEnd = performance.now() + 22000;
    match.classList.add('on'); sfx.strike();
    hint.style.opacity = 0; counter.classList.add('on');
  }
  function burnOut() {
    state = 'seek'; match.classList.remove('on');
    setHint(verb + ' to light up the matchstick');
  }
  function lightDiya(d, i) {
    d.lit = true; d.el.classList.add('lit'); litCount++; sfx.light(litCount - 1);
    count.textContent = litCount + '/' + diyas.length; counter.classList.add('bump'); setTimeout(() => counter.classList.remove('bump'), 350);
    burnEnd += 6000;
    if (litCount === diyas.length) {
      state = 'done'; match.classList.remove('on'); hint.style.opacity = 0;
      setTimeout(() => { scene1.classList.add('up'); sfx.whoosh(); }, 1500);
      setTimeout(reveal, 2400);
    } 
  }

  function glowHole(x, y, r) {
    const g = dc.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(.35, 'rgba(0,0,0,.95)');
    g.addColorStop(.7, 'rgba(0,0,0,.45)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    dc.fillStyle = g; dc.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  function tint(x, y, r, a) {
    const g = dc.createRadialGradient(x, y, 0, x, y, r * .8);
    g.addColorStop(0, `rgba(255,140,40,${a})`); g.addColorStop(1, 'rgba(255,140,40,0)');
    dc.fillStyle = g; dc.fillRect(x - r, y - r, 2 * r, 2 * r);
  }

  function frame(now) {
    const flick = Math.sin(now / 90) * 6 + Math.sin(now / 37) * 4;
    const k = K(), ly = coarse ? py - 70 * k : py;   // on touch, hold the flame above the finger
    let target = 95 * k, warm = false;
    if (state === 'match') {
      const left = burnEnd - now, s = clamp(left / 2500, .2, 1);
      match.style.setProperty('--s', s.toFixed(2));
      match.style.transform = `translate(${px}px,${ly}px) scale(${k})`;
      target = (170 + flick) * k * (.55 + .45 * s); warm = true;
      if (Math.random() < .05) sfx.tick();
      diyas.forEach((d, i) => { if (!d.lit && Math.hypot(px - d.wx(), ly - d.wy()) < 55 * k * (coarse ? 1.3 : 1)) lightDiya(d, i); });
      if (state === 'match' && left <= 0) burnOut();
    }
    if (state === 'done') target = 0;
    pr += (target - pr) * .07;

    dc.globalCompositeOperation = 'source-over'; dc.fillStyle = '#000'; dc.fillRect(0, 0, W(), H());
    dc.globalCompositeOperation = 'destination-out';
    if (pr > 1) glowHole(px, ly, pr);
    diyas.forEach(d => {
      const t = !d.lit ? 0 : state === 'done' ? 900 : (150 + flick * .6) * k;
      d.r += (t - d.r) * .05;
      if (d.r > 1) glowHole(d.wx(), d.wy(), d.r);
    });
    dc.globalCompositeOperation = 'source-over';
    if (warm && pr > 1) tint(px, ly, pr, .13);
    diyas.forEach(d => { if (d.r > 1) tint(d.wx(), d.wy(), d.r, .12); });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------------- Finale: greeting + fire crackers ---------------- */
  const rockets = [], sparks = [], hues = [38, 28, 350, 200, 130, 300, 50];
  let nextLaunch = 0;
  function reveal() {
    scene2.classList.add('go');
    for (let i = 0; i < 12; i++) sfx.letter(i);
    setTimeout(() => { [0, 260, 520].forEach(t => setTimeout(launch, t)); nextLaunch = performance.now() + 1400; requestAnimationFrame(fxLoop); }, 1700);
  }
  function launch() {
    rockets.push({ x: W() * (.12 + Math.random() * .76), y: H(), ty: H() * (.12 + Math.random() * .35), vy: -(7 + Math.random() * 3) * clamp(H() / 800, .6, 1.4) });
    sfx.launch();
  }
  function explode(x, y) {
    sfx.boom();
    const h = hues[(Math.random() * hues.length) | 0], n = 60 + (Math.random() * 40 | 0), big = (2.5 + Math.random() * 3) * K();
    for (let i = 0; i < n && sparks.length < 1200; i++) {
      const a = Math.random() * Math.PI * 2, v = Math.random() * big + .8;
      sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, h: Math.random() < .3 ? 45 : h });
    }
  }
  function fxLoop(now) {
    fc.globalCompositeOperation = 'destination-out'; fc.fillStyle = 'rgba(0,0,0,.2)'; fc.fillRect(0, 0, fx.width, fx.height);
    fc.globalCompositeOperation = 'lighter';
    if (now >= nextLaunch) { launch(); nextLaunch = now + 500 + Math.random() * 1100; }
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i]; r.y += r.vy; r.vy *= .992;
      fc.fillStyle = 'rgba(255,220,150,.9)'; fc.fillRect(r.x - 1, r.y, 2, 6);
      if (r.y <= r.ty) { explode(r.x, r.y); rockets.splice(i, 1); }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i]; s.x += s.vx; s.y += s.vy; s.vx *= .985; s.vy = s.vy * .985 + .04; s.life -= .011;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      fc.fillStyle = `hsla(${s.h},100%,${55 + s.life * 20}%,${s.life})`; fc.fillRect(s.x, s.y, 2.2, 2.2);
    }
    requestAnimationFrame(fxLoop);
  }
})();
</script>
</body>
</html>
